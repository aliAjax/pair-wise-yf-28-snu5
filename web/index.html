<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临床试验随机化</title>
<style>
body{font:15px system-ui;max-width:1040px;margin:28px auto;padding:0 16px;color:#222}
select,input,button{padding:7px;margin:3px;font:inherit}
button{cursor:pointer;border-radius:5px;border:1px solid #888;background:#fff}
button.primary{background:#1a5fb4;color:#fff;border-color:#1a5fb4}
button.danger{color:#b42318;border-color:#b42318}
.panel{border:1px solid #bbb;border-radius:8px;padding:14px 16px;margin:14px 0}
table{border-collapse:collapse;width:100%;margin:8px 0}
th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:#f0f3f7}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.tag.pending{background:#fef0c7;color:#8a6100}
.tag.effective{background:#dafbe1;color:#0f6b2c}
.tag.rejected{background:#ffebe9;color:#b42318}
.paused{background:#fef0c7;border:1px solid #e0a800;padding:8px 12px;border-radius:6px;margin:10px 0}
.muted{color:#666;font-size:12px}
label{display:inline-block;margin-right:10px}
pre{background:#f4f4f4;padding:10px;white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto}
</style></head>
<body>
<h1>临床试验随机分配与盲法</h1>
<div class="panel">
  <label>当前用户
    <select id="user"><option>site1</option><option>site2</option><option selected>coord</option><option>monitor1</option><option>monitor2</option></select>
  </label>
  <label>试验 ID <input id="trial" value="1" size="4"></label>
  <button class="primary" onclick="load()">查看试验摘要</button>
</div>

<div id="status"></div>
<div id="current"></div>
<div id="amendmentsPanel" class="panel" hidden>
  <h3>方案修订记录</h3>
  <p class="muted">修订经两位监查员分别确认、第二人同意后生效：生效前入组暂停，生效后下一例按新规则随机；早先入组者保留原分组，旧规则下预留未用的随机号不再发放。修订生效后不可再次修订。</p>
  <table id="amendmentsTable"><thead><tr>
    <th>修订号</th><th>方案版本</th><th>新分组</th><th>新分层因素</th><th>区组</th>
    <th>状态</th><th>提交</th><th>第一监查员</th><th>第二监查员</th><th>生效时间</th><th>操作</th>
  </tr></thead><tbody></tbody></table>
</div>

<div id="submitPanel" class="panel" hidden>
  <h3>提交方案修订（入组将暂停，直至两位监查员确认）</h3>
  <p><label>方案版本 <input id="pv" value="v2.0"></label>
     <label>分组（逗号分隔）<input id="arms" value="A,B,C" size="14"></label>
     <label>分层因素（逗号分隔）<input id="factors" value="risk,age" size="16"></label></p>
  <p><label>区组长度 <input id="block" value="6" size="5" type="number"></label>
     <label>随机种子（≥8位）<input id="seed" value="seed-2026-amd-1" size="20"></label></p>
  <button class="primary" onclick="submitAmendment()">提交修订</button>
</div>

<div class="panel"><h3>入组（中心用户）</h3>
  <p><label>外部编号 <input id="extId" placeholder="S001-005"></label>
     <label>分层因素 JSON <input id="enrollFactors" value='{"risk":"low"}' size="28"></label>
     <button onclick="enroll()">入组</button></p>
</div>

<pre id="out" hidden></pre>

<script>
const $=id=>document.getElementById(id);
function hdr(){return {"X-User-Id":$("user").value,"Content-Type":"application/json"}};
function show(tag,html){$(tag).innerHTML=html;$(tag).hidden=false}
function out(obj){$("out").hidden=false;$("out").textContent=JSON.stringify(obj,null,2)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const STATUS_LABEL={pending:"待确认",effective:"已生效",rejected:"已驳回"};

async function api(path,method="GET",body){
  const r=await fetch(path,{method,headers:hdr(),body:body?JSON.stringify(body):undefined});
  const data=await r.json(); if(!r.ok) throw data.error||{message:"请求失败"}; return data;
}

async function load(){
  try{
    const d=await api(`/api/trials/${$("trial").value}/summary`); render(d);
  }catch(e){$("status").innerHTML=`<b style="color:#b42318">${esc(e.message)}</b>`}
}

function render(d){
  const role=$("user").value, isCoord=role==="coord", isMonitor=role.startsWith("monitor");
  const t=d.trial, c=d.current_revision;
  $("status").innerHTML=`<div class="panel"><h3>${esc(t.name)} <span class="muted">#${t.id} · ${esc(t.status)} · 页面方案版本 ${esc(t.protocol_version)}</span></h3>
    ${d.enrollment_paused?'<div class="paused"><b>入组已暂停：</b>存在待确认的方案修订，等待两位监查员确认后下一例按新规则随机。</div>':''}
    <div>可见受试者：${d.participants_visible}；分中心：${d.by_site.map(x=>`${esc(x.site_id)}=${x.count}`).join("，")||"无"}</div></div>`;
  $("status").hidden=false;
  show("current",`<div class="panel"><h3>当前生效随机规则${c.revision_no?`（修订号 ${c.revision_no}）`:"（原始方案）"}</h3>
    <div>方案版本：${esc(c.protocol_version)}　分组：${c.arms.map(esc).join(" / ")}　分层因素：${c.strata_factors.map(esc).join(" / ")}　区组长度：${c.block_size}</div></div>`);

  const tb=$("amendmentsTable").querySelector("tbody"); tb.innerHTML="";
  $("amendmentsPanel").hidden=false;
  if(!d.amendments.length) tb.innerHTML='<tr><td colspan="11" class="muted">暂无修订</td></tr>';
  for(const a of d.amendments){
    const acts=[];
    if(isMonitor&&a.status==="pending"){
      if(a.first_confirmer!==role) acts.push(`<button onclick="confirmAmd(${a.id})">${a.first_confirmer?'第二人确认':'确认'}</button>`);
      acts.push(`<button class="danger" onclick="rejectAmd(${a.id})">驳回</button>`);
    }
    tb.insertAdjacentHTML("beforeend",`<tr>
      <td>${a.revision_no}</td><td>${esc(a.protocol_version)}</td>
      <td>${a.arms.map(esc).join(" / ")}</td><td>${a.strata_factors.map(esc).join(" / ")}</td>
      <td>${a.block_size}</td>
      <td><span class="tag ${a.status}">${STATUS_LABEL[a.status]}</span></td>
      <td>${esc(a.submitted_by)}<br><span class="muted">${esc(a.submitted_at)}</span></td>
      <td>${a.first_confirmer?`${esc(a.first_confirmer)}<br><span class="muted">${esc(a.first_confirmed_at)}</span>`:"—"}</td>
      <td>${a.second_confirmer?`${esc(a.second_confirmer)}<br><span class="muted">${esc(a.second_confirmed_at)}</span>`:"—"}</td>
      <td>${esc(a.effective_at||"")||"—"}</td>
      <td>${acts.join(" ")||"—"}</td></tr>`);
  }
  const hasOpen=d.amendments.some(a=>a.status==="pending"||a.status==="effective");
  $("submitPanel").hidden=!(isCoord&&t.status==="running"&&!hasOpen);
}

async function submitAmendment(){
  try{
    const body={protocol_version:$("pv").value,arms:$("arms").value.split(",").map(s=>s.trim()),
      strata_factors:$("factors").value.split(",").map(s=>s.trim()),block_size:Number($("block").value),seed:$("seed").value};
    out(await api(`/api/trials/${$("trial").value}/amendments`,"POST",body)); load();
  }catch(e){out({error:e})}
}
async function confirmAmd(id){try{out(await api(`/api/amendments/${id}/confirm`,"POST",{}));load()}catch(e){out({error:e})}}
async function rejectAmd(id){
  const reason=prompt("驳回原因（可选）","")||"";
  try{out(await api(`/api/amendments/${id}/reject`,"POST",{reason}));load()}catch(e){out({error:e})}
}
async function enroll(){
  let factors={}; try{factors=JSON.parse($("enrollFactors").value||"{}")}catch{return out({error:{message:"分层因素 JSON 格式错误"}})}
  try{out(await api(`/api/trials/${$("trial").value}/enroll`,"POST",{external_id:$("extId").value,factors}))}catch(e){out({error:e})}
}
</script></body></html>
